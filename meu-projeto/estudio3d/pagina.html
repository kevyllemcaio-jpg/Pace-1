<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #000; }
  #tela { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; }
  #camada { position: absolute; inset: 0; font-family: Inter, sans-serif; pointer-events: none; }
  .contorno { color: #fff; -webkit-text-stroke: 9px #111; paint-order: stroke fill; }
  .destaque { color: #FFD21F; }
  .legenda { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font-weight: 900; font-size: 44px; }
  .titulo { position: absolute; left: 20px; right: 20px; top: 70px; text-align: center; font-weight: 900; font-size: 50px; line-height: 1.12; }
  .final { position: absolute; left: 20px; right: 20px; top: 64px; text-align: center; font-weight: 900; font-size: 52px; line-height: 1.1; }
  .cartao { position: absolute; left: 50%; top: 150px; background: #fff; border-radius: 18px; padding: 8px 30px 12px;
            text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .cartao .num { color: #E8322B; font-weight: 900; font-size: 66px; line-height: 1.05; }
  .cartao .sub { color: #222; font-weight: 800; font-size: 15px; letter-spacing: .5px; }
  .etiqueta { position: absolute; left: 50%; top: 250px; background: #fff; color: #E8322B; border-radius: 999px;
              padding: 7px 20px 7px 16px; font-weight: 900; font-size: 22px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .etiqueta::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #E8322B; margin-right: 9px; vertical-align: 2px; }
  .ok { position: absolute; left: 50%; top: 250px; width: 76px; height: 76px; border-radius: 50%; background: #2DBE60;
        border: 6px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); color: #fff; font-weight: 900; font-size: 50px;
        line-height: 76px; text-align: center; }
  .som { position: absolute; left: 50%; top: 360px; font-weight: 900; font-size: 72px; white-space: nowrap; }
  /* título da capa "meio": mais baixo, centralizado e dinâmico */
  .titulo.meio { top: 540px; font-size: 58px; line-height: 1.06; }
  .titulo.meio .linha { display: inline-block; }
  .titulo.meio .linha.l0 { transform: rotate(-3deg); }
  .titulo.meio .linha.l1 { transform: rotate(2deg) scale(1.08); }
  .titulo.meio .linha.l2 { transform: rotate(-2deg); }
  /* ---- formato horizontal (YouTube 16:9) ---- */
  body.horizontal, html.horizontal { width: 1280px; height: 720px; }
  body.horizontal #tela { width: 1280px; height: 720px; }
  body.horizontal .legenda { top: 588px; font-size: 42px; }
  body.horizontal .titulo { top: 34px; font-size: 50px; left: 140px; right: 140px; }
  body.horizontal .final { top: 60px; font-size: 54px; }
  body.horizontal .cartao { top: 70px; }
  body.horizontal .etiqueta, body.horizontal .ok { top: 160px; }
  body.horizontal .som { top: 200px; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="camada"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.get('formato') === 'horizontal') { document.body.classList.add('horizontal'); document.documentElement.classList.add('horizontal'); }
  const { iniciar } = await import('./motor.js');
  const video = await import(`./videos/${params.get('video')}.js`);
  if (video.preparar) await video.preparar();
  window.MOTOR = iniciar(video);
  window.PRONTO = true;
</script>
</body>
</html>
