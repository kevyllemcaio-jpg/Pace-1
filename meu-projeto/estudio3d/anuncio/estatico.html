<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; font-family: Inter, sans-serif; }
  .peca { position: relative; width: 1080px; overflow: hidden;
          background: radial-gradient(circle at 50% 30%, #3B5BDB 0%, #1B2350 60%, #120F33 100%); color: #fff; }
  .feed { height: 1350px; }
  .story { height: 1920px; }
  .contorno { -webkit-text-stroke: 12px #111; paint-order: stroke fill; }
  .amarelo { color: #FFD21F; }
  .topo { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; line-height: 1.05; }
  .grade { position: absolute; left: 50%; transform: translateX(-50%); display: grid; gap: 18px; }
  .grade img { width: 100%; border-radius: 22px; border: 6px solid #fff; box-shadow: 0 10px 0 rgba(0,0,0,.35); display: block; }
  .tag { position: absolute; background: #E8322B; color: #fff; font-weight: 900; border-radius: 999px; padding: 10px 26px; transform: rotate(-6deg);
         box-shadow: 0 6px 0 rgba(0,0,0,.3); border: 5px solid #fff; }
  .lista { position: absolute; left: 70px; right: 70px; font-weight: 800; }
  .lista div { margin: 10px 0; }
  .lista b { color: #2DBE60; margin-right: 12px; }
  .botao { position: absolute; left: 50%; transform: translateX(-50%); background: #2DBE60; color: #fff; font-weight: 900; border-radius: 999px;
           padding: 22px 64px; border: 6px solid #fff; box-shadow: 0 10px 0 #1E8A44; white-space: nowrap; }
  .logo { position: absolute; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .aviso { position: absolute; left: 40px; right: 40px; text-align: center; font-size: 22px; opacity: .75; font-weight: 600; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  const formato = new URLSearchParams(location.search).get('formato') || 'feed';
  const img = (n) => `<img src="../curso/img/${n}.jpg">`;
  const aviso = '<div class="aviso" style="bottom:22px">Requer computador e assinatura de uma IA que programa (ex.: Claude Code). Resultados dependem da sua dedicação.</div>';
  const html = formato === 'feed' ? `
  <div class="peca feed">
    <div class="topo contorno" style="top:44px;font-size:82px">CRIE VÍDEOS 3D<br>COM <span class="amarelo">IA</span></div>
    <div class="topo" style="top:236px;font-size:34px;font-weight:800;opacity:.95">sem câmera, sem edição e sem saber programar</div>
    <div class="grade" style="top:310px;width:860px;grid-template-columns:repeat(4,1fr)">
      ${['thumb-ponte','thumb-navio','thumb-foguete','thumb-elevador'].map(img).join('')}
    </div>
    <div class="tag" style="top:330px;right:58px;font-size:30px">100% IA</div>
    <div class="lista" style="top:720px;font-size:40px">
      <div><b>✓</b>Roteiro, cenário 3D, voz e legenda</div>
      <div><b>✓</b>Música original, sem direitos</div>
      <div><b>✓</b>5 aulas curtas + kit do estúdio</div>
    </div>
    <img class="logo" src="../curso/img/logo.jpg" style="left:70px;top:915px;width:150px">
    <div style="position:absolute;left:240px;top:940px;font-weight:900;font-size:46px">Constrói <span class="amarelo">Isso Aí!</span></div>
    <div style="position:absolute;left:240px;top:998px;font-weight:700;font-size:28px;opacity:.85">Curso: vídeos "como funciona" com IA</div>
    <div class="botao" style="top:1110px;font-size:48px">SAIBA MAIS ›</div>
    ${aviso}
  </div>` : `
  <div class="peca story">
    <div class="topo contorno" style="top:150px;font-size:96px">ESSES VÍDEOS<br>FORAM FEITOS<br><span class="amarelo">100% COM IA</span></div>
    <div class="grade" style="top:540px;width:760px;grid-template-columns:repeat(3,1fr)">
      ${['thumb-ponte','thumb-navio','thumb-foguete','thumb-elevador','thumb-terremoto','thumb-descarga'].map(img).join('')}
    </div>
    <div class="topo" style="top:1500px;font-size:50px;font-weight:900">Aprenda a criar os seus<br><span class="amarelo">em 5 aulas curtas</span></div>
    <div class="botao" style="top:1665px;font-size:56px">SAIBA MAIS ›</div>
    <img class="logo" src="../curso/img/logo.jpg" style="left:50%;transform:translateX(-50%);top:30px;width:100px">
    ${aviso.replace('bottom:22px','bottom:40px')}
  </div>`;
  document.getElementById('raiz').innerHTML = html;
  Promise.all([...document.images].map((i) => i.complete ? 1 : new Promise((r) => (i.onload = i.onerror = r)))).then(() => (window.PRONTO = true));
</script>
</body>
</html>
